    <text x="44" y="100" font-size="17" fill="#74748b">Used for your Halyard Scale plan</text>
    <rect x="44" y="132" width="330" height="200" rx="18" fill="url(#card)"/>
    <rect x="72" y="166" width="46" height="34" rx="6" fill="#ffc266"/>
